<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 24px;
      background: #f4f6f8;
    }
    form {
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 10px #0001;
    }
    label { display: block; margin-top: 14px; }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 6px;
    }
    button { margin-top: 20px; cursor: pointer; }
    #message { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Event Registration</h1>
  <form id="registrationForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="event">Select Event</label>
    <select id="event" name="event" required>
      <option value="">-- Choose an event --</option>
      <option value="Technical Quiz">Technical Quiz</option>
      <option value="Coding Contest">Coding Contest</option>
      <option value="Project Expo">Project Expo</option>
    </select>

    <button type="submit">Register</button>
    <p id="message" role="status"></p>
  </form>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const selectedEvent = document.getElementById("event").value;
      const message = document.getElementById("message");

      if (!name || !selectedEvent) {
        message.textContent = "Please fill in all required fields.";
        return;
      }

      message.textContent = "Thank you, " + name + "! Your registration for " + selectedEvent + " is complete.";
      this.reset();
    });
  </script>
</body>
</html>
